<!DOCTYPE html>
<html>
<head>
    <title>Генератор иконок PalЫCH</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f7fb; }
        .icon-preview { display: inline-block; margin: 10px; text-align: center; }
        canvas { border: 1px solid #ccc; border-radius: 10px; }
        button { background: #0b2b3c; color: white; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #1c4055; }
    </style>
</head>
<body>
    <h1>🎨 Генератор иконок PalЫCH</h1>
    <p>Нажмите "Скачать" и сохраните файлы в папку <code>icons/</code>.</p>

    <div class="icon-preview">
        <canvas id="c192" width="192" height="192"></canvas>
        <br><button onclick="download('c192', 'icon-192.png')">Скачать 192×192</button>
    </div>

    <div class="icon-preview">
        <canvas id="c512" width="512" height="512"></canvas>
        <br><button onclick="download('c512', 'icon-512.png')">Скачать 512×512</button>
    </div>

    <script>
        function drawIcon(id, size) {
            const canvas = document.getElementById(id);
            const ctx = canvas.getContext('2d');

            // Фон
            ctx.fillStyle = '#0b2b3c';
            ctx.fillRect(0, 0, size, size);

            // Желтая полоса снизу
            ctx.fillStyle = '#f6b83d';
            ctx.fillRect(0, size * 0.88, size, size * 0.12);

            // Буква "P"
            ctx.fillStyle = '#f6b83d';
            ctx.font = `bold ${size * 0.55}px 'Segoe UI', sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('P', size / 2, size / 2 + size * 0.02);

            // Иконка машины (маленькая в углу)
            ctx.fillStyle = '#ffffff';
            ctx.font = `${size * 0.12}px sans-serif`;
            ctx.fillText('🚗', size / 2, size * 0.15);
        }

        function download(id, filename) {
            const canvas = document.getElementById(id);
            const url = canvas.toDataURL('image/png');
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
        }

        drawIcon('c192', 192);
        drawIcon('c512', 512);
    </script>
</body>
</html>
