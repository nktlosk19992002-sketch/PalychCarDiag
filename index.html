<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PalЫCH - Клиентский кабинет</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: #f4f7fb; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .app { max-width: 520px; width: 100%; background: white; border-radius: 32px; box-shadow: 0 20px 40px rgba(0,0,0,0.15); overflow: hidden; }
        .header { background: #0b2b3c; padding: 24px 28px; color: white; text-align: center; border-bottom: 4px solid #f6b83d; }
        .header h1 { font-size: 1.6rem; font-weight: 600; }
        .header h1 i { color: #f6b83d; }
        .header p { font-size: 0.85rem; color: #8ab4c9; margin-top: 4px; }
        .content { padding: 24px 28px; }
        
        /* Авторизация */
        .auth-form { display: block; }
        .auth-form.hidden { display: none; }
        .auth-form h2 { color: #0b2b3c; font-size: 1.2rem; margin-bottom: 16px; }
        .auth-form .form-group { margin-bottom: 14px; }
        .auth-form label { display: block; font-weight: 600; margin-bottom: 4px; color: #1f4055; font-size: 0.85rem; }
        .auth-form input { width: 100%; padding: 12px 16px; border: 2px solid #d4dee9; border-radius: 12px; font-size: 1rem; transition: 0.15s; background: white; }
        .auth-form input:focus { border-color: #f6b83d; outline: none; box-shadow: 0 0 0 3px rgba(246,184,61,0.15); }
        .auth-form .btn-auth { width: 100%; padding: 14px; background: #0b2b3c; color: white; border: none; border-radius: 50px; font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .auth-form .btn-auth:hover { background: #1c4055; }
        .auth-form .btn-auth i { color: #f6b83d; margin-right: 8px; }
        .auth-error { color: #b33c3c; font-size: 0.85rem; margin-top: 8px; display: none; background: #fadad8; padding: 10px 14px; border-radius: 10px; }
        
        /* Личный кабинет */
        .dashboard { display: none; }
        .dashboard.active { display: block; }
        
        .car-card { background: #f8fafc; border-radius: 16px; padding: 16px 20px; margin-bottom: 16px; border-left: 4px solid #f6b83d; }
        .car-card .plate { font-size: 1.3rem; font-weight: 700; color: #0b2b3c; }
        .car-card .car-info { color: #3a657e; font-size: 0.9rem; margin-top: 4px; }
        .car-card .car-info i { width: 20px; color: #f6b83d; }
        
        .status-card { background: #eef3f8; border-radius: 16px; padding: 16px 20px; margin-bottom: 16px; }
        .status-card .status-title { font-size: 0.8rem; color: #3a657e; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .status-card .status-value { font-size: 1.4rem; font-weight: 700; color: #0b2b3c; margin-top: 4px; }
        .status-card .status-value .badge-status { display: inline-block; padding: 4px 16px; border-radius: 40px; font-size: 0.9rem; }
        .status-new { background: #f6b83d; color: #0b2b3c; }
        .status-work { background: #2d6b84; color: white; }
        .status-wait { background: #d4a017; color: white; }
        .status-done { background: #1f7b4a; color: white; }
        .status-fail { background: #b33c3c; color: white; }
        .status-cancel { background: #888; color: white; }
        
        .history-card { background: white; border: 1px solid #e4ecf4; border-radius: 12px; padding: 12px 16px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .history-card .h-type { font-weight: 600; color: #0b2b3c; }
        .history-card .h-date { font-size: 0.8rem; color: #3a657e; }
        .history-card .h-status { font-size: 0.7rem; padding: 2px 10px; border-radius: 20px; font-weight: 600; }
        
        .btn-create { width: 100%; padding: 14px; background: #f6b83d; color: #0b2b3c; border: none; border-radius: 50px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: 0.2s; margin-top: 12px; }
        .btn-create:hover { transform: scale(1.02); box-shadow: 0 8px 20px rgba(246,184,61,0.3); }
        .btn-create i { margin-right: 8px; }
        
        .btn-cancel { width: 100%; padding: 12px; background: #b33c3c; color: white; border: none; border-radius: 50px; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: 0.2s; margin-top: 8px; }
        .btn-cancel:hover { background: #a12b2b; }
        .btn-cancel.hidden { display: none; }
        
        .btn-refresh { width: 100%; padding: 10px; background: #2d6b84; color: white; border: none; border-radius: 50px; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: 0.2s; margin-top: 8px; }
        .btn-refresh:hover { background: #1f4a5e; }
        .btn-refresh i { margin-right: 6px; }
        .btn-refresh:disabled { opacity: 0.6; cursor: not-allowed; }
        
        .form-booking { background: #f8fafc; border-radius: 16px; padding: 16px 20px; margin-top: 16px; display: none; }
        .form-booking.active { display: block; }
        .form-booking h3 { color: #0b2b3c; margin-bottom: 12px; font-size: 1rem; }
        .form-booking .form-group { margin-bottom: 12px; }
        .form-booking label { display: block; font-weight: 600; margin-bottom: 4px; color: #1f4055; font-size: 0.8rem; }
        .form-booking input, .form-booking select, .form-booking textarea { width: 100%; padding: 10px 14px; border: 1px solid #d4dee9; border-radius: 10px; font-size: 0.9rem; background: white; }
        .form-booking input:focus, .form-booking select:focus { border-color: #f6b83d; outline: none; }
        .form-booking .btn-submit { width: 100%; padding: 12px; background: #1f7b4a; color: white; border: none; border-radius: 50px; font-weight: 700; cursor: pointer; }
        .form-booking .btn-submit:hover { background: #2a965a; }
        .form-booking .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
        
        .logout-btn { background: transparent; border: 1px solid #d4dee9; color: #3a657e; padding: 6px 16px; border-radius: 30px; cursor: pointer; font-size: 0.8rem; margin-top: 16px; width: 100%; }
        .logout-btn:hover { background: #f4f7fb; }
        
        .text-center { text-align: center; }
        .mt-2 { margin-top: 12px; }
        .mb-2 { margin-bottom: 12px; }
        .hidden { display: none !important; }
        
        .loading { opacity: 0.6; pointer-events: none; }
        
        /* Уведомления */
        .notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #0b2b3c;
            color: white;
            padding: 16px 24px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            z-index: 1000;
            max-width: 90%;
            text-align: center;
            font-weight: 600;
            border-left: 4px solid #f6b83d;
            animation: slideDown 0.5s ease;
        }
        .notification.success { border-left-color: #1f7b4a; }
        .notification.error { border-left-color: #b33c3c; }
        .notification.info { border-left-color: #2d6b84; }
        
        @keyframes slideDown {
            from { transform: translateX(-50%) translateY(-20px); opacity: 0; }
            to { transform: translateX(-50%) translateY(0); opacity: 1; }
        }
        
        @media (max-width: 500px) {
            .content { padding: 16px; }
            .header { padding: 16px 20px; }
            .header h1 { font-size: 1.2rem; }
            .car-card .plate { font-size: 1rem; }
            .status-card .status-value { font-size: 1.1rem; }
        }
    </style>
</head>
<body>
<div class="app" id="app">
    <!-- Шапка -->
    <div class="header">
        <h1><i class="fas fa-car"></i> PalЫCH</h1>
        <p>Клиентский кабинет</p>
    </div>

    <!-- Контент -->
    <div class="content">
        
        <!-- ===== АВТОРИЗАЦИЯ ===== -->
        <div class="auth-form" id="authForm">
            <h2><i class="fas fa-lock" style="color:#f6b83d;"></i> Вход в кабинет</h2>
            <p style="color:#3a657e; font-size:0.85rem; margin-bottom:16px;">Введите гос. номер и код доступа, полученный в автосервисе</p>
            
            <div class="form-group">
                <label><i class="fas fa-id-card"></i> Государственный номер</label>
                <input type="text" id="authPlate" placeholder="А123ВС777" style="text-transform:uppercase;">
            </div>
            
            <div class="form-group">
                <label><i class="fas fa-key"></i> Код доступа</label>
                <input type="password" id="authCode" placeholder="0000" maxlength="4" inputmode="numeric" style="letter-spacing:8px; font-weight:700; font-size:1.2rem;">
            </div>
            
            <button class="btn-auth" id="loginBtn" onclick="login()">
                <i class="fas fa-sign-in-alt"></i> Войти
            </button>
            <div class="auth-error" id="authError"></div>
        </div>
        
        <!-- ===== ЛИЧНЫЙ КАБИНЕТ ===== -->
        <div class="dashboard" id="dashboard">
            
            <!-- Информация об авто -->
            <div class="car-card" id="carCard">
                <div class="plate" id="clientPlate">—</div>
                <div class="car-info"><i class="fas fa-car"></i> <span id="clientCar">—</span></div>
                <div class="car-info" style="margin-top:2px;"><i class="fas fa-user"></i> <span id="clientName">—</span></div>
                <div class="car-info"><i class="fas fa-phone"></i> <span id="clientPhone">—</span></div>
            </div>
            
            <!-- Текущий статус -->
            <div class="status-card" id="statusCard">
                <div class="status-title"><i class="fas fa-clock"></i> Текущий статус</div>
                <div class="status-value">
                    <span class="badge-status status-new" id="statusBadge">Нет активных записей</span>
                </div>
                <div style="margin-top:8px; font-size:0.85rem; color:#3a657e;" id="statusDetail">Вы можете записаться на обслуживание</div>
                
                <!-- Кнопка отмены записи -->
                <button class="btn-cancel hidden" id="cancelBtn" onclick="cancelBooking()">
                    <i class="fas fa-times-circle"></i> Отменить запись
                </button>
                
                <!-- Кнопка проверки статуса -->
                <button class="btn-refresh" id="refreshBtn" onclick="refreshStatus()">
                    <i class="fas fa-sync"></i> Проверить статус
                </button>
            </div>
            
            <!-- Кнопка "Записаться" -->
            <button class="btn-create" onclick="toggleBookingForm()">
                <i class="fas fa-calendar-plus"></i> Записаться на обслуживание
            </button>
            
            <!-- Форма записи -->
            <div class="form-booking" id="bookingForm">
                <h3><i class="fas fa-calendar-check" style="color:#f6b83d;"></i> Новая запись</h3>
                
                <div class="form-group">
                    <label>Тип обслуживания</label>
                    <select id="bkType">
                        <option value="diagnostic">🔍 Диагностика</option>
                        <option value="repair">🔧 Ремонт</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Дата</label>
                    <input type="date" id="bkDate">
                </div>
                
                <div class="form-group">
                    <label>Время (необязательно)</label>
                    <input type="time" id="bkTime">
                </div>
                
                <div class="form-group">
                    <label>Причина записи</label>
                    <textarea id="bkReason" rows="2" placeholder="Опишите проблему..."></textarea>
                </div>
                
                <button class="btn-submit" id="submitBtn" onclick="createBooking()">
                    <i class="fas fa-paper-plane"></i> Отправить заявку
                </button>
                <button class="logout-btn" onclick="toggleBookingForm()" style="margin-top:8px; width:100%;">
                    <i class="fas fa-times"></i> Закрыть
                </button>
            </div>
            
            <!-- История -->
            <h3 style="color:#0b2b3c; font-size:1rem; margin-top:20px; margin-bottom:10px;">
                <i class="fas fa-history" style="color:#f6b83d;"></i> История обслуживания
            </h3>
            <div id="historyContainer"></div>
            
            <!-- Выход -->
            <button class="logout-btn" onclick="logout()" style="width:100%; margin-top:16px;">
                <i class="fas fa-sign-out-alt"></i> Выйти
            </button>
        </div>
    </div>
</div>

<script>
// ============================================================
// КОНФИГУРАЦИЯ SUPABASE
// ============================================================
const SUPABASE_URL = 'https://xpaqczxqkuzfwmnimzsx.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhwYXFjenhxa3V6ZndtbmltenN4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5Njg4NDcsImV4cCI6MjEwNDU0NDg0N30.hH62d6aCsgBchg4MVPey714O3-FR9bNaqnsm_T32zAk';

// ============================================================
// ФУНКЦИЯ ЗАПРОСОВ К SUPABASE
// ============================================================
async function supabaseQuery(table, method, data = null, id = null) {
    let url = `${SUPABASE_URL}/rest/v1/${table}`;
    const headers = {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'return=representation'
    };
    
    let options = { method, headers };
    
    if (method === 'GET') {
        url += '?select=*';
    } else if (method === 'POST') {
        options.body = JSON.stringify(data);
    } else if (method === 'PATCH') {
        url += `?id=eq.${id}`;
        options.body = JSON.stringify(data);
    } else if (method === 'DELETE') {
        url += `?id=eq.${id}`;
    }
    
    const response = await fetch(url, options);
    const result = await response.json();
    
    if (!response.ok) {
        throw { code: response.status, message: result.message || 'Ошибка запроса', details: result };
    }
    return result;
}

// ============================================================
// СОСТОЯНИЕ
// ============================================================
let currentClient = null;
let currentBooking = null;
let statusCheckInterval = null;

// ============================================================
// УВЕДОМЛЕНИЯ
// ============================================================
function showNotification(message, type = 'info') {
    const existing = document.querySelector('.notification');
    if (existing) existing.remove();
    
    const div = document.createElement('div');
    div.className = `notification ${type}`;
    div.textContent = message;
    document.body.appendChild(div);
    
    setTimeout(() => {
        div.style.opacity = '0';
        div.style.transition = 'opacity 0.5s';
        setTimeout(() => div.remove(), 500);
    }, 4000);
}

// ============================================================
// АВТОРИЗАЦИЯ
// ============================================================
window.login = async function() {
    const plate = document.getElementById('authPlate').value.trim().toUpperCase();
    const code = document.getElementById('authCode').value.trim();
    const errorEl = document.getElementById('authError');
    const btn = document.getElementById('loginBtn');
    
    errorEl.style.display = 'none';
    errorEl.textContent = '';
    
    if (!plate || !code) {
        showError('Введите номер и код доступа');
        return;
    }
    
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Проверка...';
    
    try {
        const data = await supabaseQuery('clients', 'GET');
        const client = data.find(c => 
            c.plate && c.plate.toUpperCase() === plate && 
            c.access_code === code
        );
        
        if (!client) {
            showError('❌ Неверный номер или код доступа');
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Войти';
            return;
        }
        
        currentClient = client;
        
        document.getElementById('authForm').classList.add('hidden');
        document.getElementById('dashboard').classList.add('active');
        
        await loadClientData();
        
        // Запускаем автообновление статуса
        startAutoRefresh();
        
        showNotification(`✅ Добро пожаловать, ${client.name}!`, 'success');
        
    } catch (error) {
        console.error('Ошибка входа:', error);
        showError('❌ Ошибка соединения. Проверьте интернет.');
    }
    
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Войти';
};

function showError(msg) {
    const el = document.getElementById('authError');
    el.textContent = msg;
    el.style.display = 'block';
    setTimeout(() => { el.style.display = 'none'; }, 5000);
}

// ============================================================
// ЗАГРУЗКА ДАННЫХ КЛИЕНТА
// ============================================================
async function loadClientData() {
    if (!currentClient) return;
    
    document.getElementById('clientPlate').textContent = currentClient.plate || '—';
    document.getElementById('clientCar').textContent = currentClient.car || '—';
    document.getElementById('clientName').textContent = currentClient.name || '—';
    document.getElementById('clientPhone').textContent = currentClient.phone || '—';
    
    await loadBooking();
    await loadHistory();
}

// ============================================================
// ЗАГРУЗКА АКТИВНОЙ ЗАПИСИ
// ============================================================
async function loadBooking() {
    try {
        const allBookings = await supabaseQuery('bookings', 'GET');
        const active = allBookings.find(b => 
            b.client_id === currentClient.id && 
            !['отремонтирована', 'не отремонтирована', 'продиагностирована', 'отменена'].includes(b.status)
        );
        
        if (active) {
            currentBooking = active;
            updateStatusDisplay(active);
        } else {
            currentBooking = null;
            document.getElementById('statusBadge').textContent = 'Нет активных записей';
            document.getElementById('statusBadge').className = 'badge-status status-new';
            document.getElementById('statusDetail').textContent = 'Вы можете записаться на обслуживание';
            document.getElementById('cancelBtn').classList.add('hidden');
        }
    } catch (error) {
        console.error('Ошибка загрузки записи:', error);
    }
}

// ============================================================
// ОБНОВЛЕНИЕ ОТОБРАЖЕНИЯ СТАТУСА
// ============================================================
function updateStatusDisplay(booking) {
    const statusMap = {
        'новая': { text: 'Новая', class: 'status-new', detail: 'Ваша заявка принята. Ожидайте подтверждения.' },
        'в работе': { text: 'В работе', class: 'status-work', detail: 'Мастер уже занимается вашим автомобилем.' },
        'ожидается': { text: 'Ожидается', class: 'status-wait', detail: 'Ожидаем запчасти или согласование.' },
        'отремонтирована': { text: '✅ Отремонтирована', class: 'status-done', detail: 'Работы выполнены! Автомобиль готов.' },
        'не отремонтирована': { text: '❌ Не отремонтирована', class: 'status-fail', detail: 'Ремонт не выполнен. Обратитесь к мастеру.' },
        'продиагностирована': { text: '🔍 Продиагностирована', class: 'status-done', detail: 'Диагностика завершена.' },
        'отменена': { text: 'Отменена', class: 'status-cancel', detail: 'Запись отменена.' }
    };
    
    const info = statusMap[booking.status] || { text: booking.status, class: 'status-new', detail: '' };
    
    document.getElementById('statusBadge').textContent = info.text;
    document.getElementById('statusBadge').className = `badge-status ${info.class}`;
    document.getElementById('statusDetail').textContent = info.detail;
    
    if (booking.status === 'новая' || booking.status === 'в работе' || booking.status === 'ожидается') {
        document.getElementById('cancelBtn').classList.remove('hidden');
    } else {
        document.getElementById('cancelBtn').classList.add('hidden');
    }
}

// ============================================================
// ЗАГРУЗКА ИСТОРИИ
// ============================================================
async function loadHistory() {
    const container = document.getElementById('historyContainer');
    
    try {
        const allJournal = await supabaseQuery('journal', 'GET');
        const history = allJournal
            .filter(j => j.client_id === currentClient.id)
            .slice(0, 10);
        
        if (!history || history.length === 0) {
            container.innerHTML = `
                <div style="color:#3a657e; font-size:0.85rem; text-align:center; padding:20px;">
                    <i class="fas fa-inbox" style="font-size:1.5rem; display:block; margin-bottom:6px;"></i>
                    История пуста
                </div>
            `;
            return;
        }
        
        container.innerHTML = history.map(entry => {
            const typeIcon = entry.type === 'diagnostic' ? '🔍' : '🔧';
            const typeName = entry.type === 'diagnostic' ? 'Диагностика' : 'Ремонт';
            return `
                <div class="history-card">
                    <div>
                        <span class="h-type">${typeIcon} ${typeName}</span>
                        <span style="font-size:0.8rem; color:#3a657e; margin-left:8px;">${entry.car || '—'}</span>
                    </div>
                    <div>
                        <span class="h-date">${entry.date || ''}</span>
                        <span class="h-status" style="background:#d3f0d8; color:#0a6030;">Завершено</span>
                    </div>
                </div>
            `;
        }).join('');
        
    } catch (error) {
        console.error('Ошибка загрузки истории:', error);
        container.innerHTML = `
            <div style="color:#b33c3c; font-size:0.85rem; text-align:center; padding:20px;">
                Ошибка загрузки истории
            </div>
        `;
    }
}

// ============================================================
// ПРОВЕРКА СТАТУСА (КНОПКА)
// ============================================================
window.refreshStatus = async function() {
    if (!currentClient) {
        showNotification('⚠️ Авторизуйтесь заново', 'error');
        return;
    }
    
    const btn = document.getElementById('refreshBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Проверка...';
    
    try {
        const allBookings = await supabaseQuery('bookings', 'GET');
        const active = allBookings.find(b => 
            b.client_id === currentClient.id && 
            !['отремонтирована', 'не отремонтирована', 'продиагностирована', 'отменена'].includes(b.status)
        );
        
        if (active) {
            if (!currentBooking || currentBooking.status !== active.status) {
                currentBooking = active;
                updateStatusDisplay(active);
                showNotification(`🔄 Статус обновлен: ${active.status}`, 'info');
            } else {
                showNotification('✅ Статус актуален', 'success');
            }
        } else if (currentBooking) {
            currentBooking = null;
            document.getElementById('statusBadge').textContent = 'Нет активных записей';
            document.getElementById('statusBadge').className = 'badge-status status-new';
            document.getElementById('statusDetail').textContent = 'Вы можете записаться на обслуживание';
            document.getElementById('cancelBtn').classList.add('hidden');
            showNotification('📋 Активных записей нет', 'info');
        } else {
            showNotification('✅ Активных записей нет', 'success');
        }
        
        await loadHistory();
        
    } catch (error) {
        console.error('Ошибка обновления:', error);
        showNotification('❌ Ошибка обновления статуса', 'error');
    }
    
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-sync"></i> Проверить статус';
};

// ============================================================
// АВТОМАТИЧЕСКОЕ ОБНОВЛЕНИЕ СТАТУСА
// ============================================================
function startAutoRefresh() {
    if (statusCheckInterval) {
        clearInterval(statusCheckInterval);
    }
    
    statusCheckInterval = setInterval(async () => {
        if (!currentClient) return;
        
        try {
            const allBookings = await supabaseQuery('bookings', 'GET');
            const active = allBookings.find(b => 
                b.client_id === currentClient.id && 
                !['отремонтирована', 'не отремонтирована', 'продиагностирована', 'отменена'].includes(b.status)
            );
            
            if (active) {
                if (!currentBooking || currentBooking.status !== active.status) {
                    currentBooking = active;
                    updateStatusDisplay(active);
                    showNotification(`🔄 Статус изменен: ${active.status}`, 'info');
                    await loadHistory();
                }
            } else if (currentBooking) {
                currentBooking = null;
                document.getElementById('statusBadge').textContent = 'Нет активных записей';
                document.getElementById('statusBadge').className = 'badge-status status-new';
                document.getElementById('statusDetail').textContent = 'Вы можете записаться на обслуживание';
                document.getElementById('cancelBtn').classList.add('hidden');
                showNotification('📋 Активных записей нет', 'info');
                await loadHistory();
            }
        } catch (error) {
            console.warn('Ошибка автообновления:', error);
        }
    }, 15000); // Каждые 15 секунд
}

// ============================================================
// ЗАПИСЬ НА ОБСЛУЖИВАНИЕ
// ============================================================
window.toggleBookingForm = function() {
    const form = document.getElementById('bookingForm');
    form.classList.toggle('active');
    if (form.classList.contains('active')) {
        document.getElementById('bkDate').value = new Date().toISOString().slice(0,10);
        document.getElementById('bkTime').value = '';
        document.getElementById('bkReason').value = '';
    }
};

window.createBooking = async function() {
    if (!currentClient) {
        showNotification('❌ Клиент не найден. Авторизуйтесь заново.', 'error');
        return;
    }
    
    const type = document.getElementById('bkType').value;
    const date = document.getElementById('bkDate').value;
    const time = document.getElementById('bkTime').value;
    const reason = document.getElementById('bkReason').value.trim();
    const btn = document.getElementById('submitBtn');
    
    if (!date) {
        showNotification('⚠️ Выберите дату', 'error');
        return;
    }
    
    const bookingData = {
        client_id: currentClient.id,
        name: currentClient.name || 'Клиент',
        phone: currentClient.phone || '',
        plate: currentClient.plate || '',
        car: currentClient.car || '',
        type: type,
        date: date,
        time: time || null,
        reason: reason || null,
        status: 'новая'
    };
    
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Отправка...';
    
    try {
        const result = await supabaseQuery('bookings', 'POST', bookingData);
        
        if (!result || result.length === 0) {
            showNotification('⚠️ Запись создана, но данные не вернулись.', 'error');
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-paper-plane"></i> Отправить заявку';
            return;
        }
        
        showNotification('✅ Заявка отправлена! Мы свяжемся с вами.', 'success');
        
        document.getElementById('bookingForm').classList.remove('active');
        
        currentBooking = result[0];
        updateStatusDisplay(currentBooking);
        await loadHistory();
        
    } catch (error) {
        console.error('Ошибка:', error);
        let errorMsg = '❌ Не удалось создать запись.\n\n';
        if (error.code === 401) {
            errorMsg += '🔒 Ошибка доступа. Проверьте настройки Supabase.';
        } else if (error.code === 400) {
            errorMsg += '📋 Неверные данные. Проверьте заполнение полей.';
        } else {
            errorMsg += error.message || 'Попробуйте позже.';
        }
        showNotification(errorMsg, 'error');
    }
    
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-paper-plane"></i> Отправить заявку';
};

// ============================================================
// ОТМЕНА ЗАПИСИ
// ============================================================
window.cancelBooking = async function() {
    if (!currentBooking) return;
    
    if (!confirm('Вы уверены, что хотите отменить запись?')) return;
    
    try {
        await supabaseQuery('bookings', 'PATCH', { status: 'отменена' }, currentBooking.id);
        
        showNotification('✅ Запись отменена.', 'success');
        
        currentBooking = null;
        document.getElementById('statusBadge').textContent = 'Нет активных записей';
        document.getElementById('statusBadge').className = 'badge-status status-new';
        document.getElementById('statusDetail').textContent = 'Вы можете записаться на обслуживание';
        document.getElementById('cancelBtn').classList.add('hidden');
        
        await loadHistory();
        
    } catch (error) {
        console.error('Ошибка отмены:', error);
        showNotification('❌ Не удалось отменить запись. Попробуйте позже.', 'error');
    }
};

// ============================================================
// ВЫХОД
// ============================================================
window.logout = function() {
    if (!confirm('Выйти из кабинета?')) return;
    
    if (statusCheckInterval) {
        clearInterval(statusCheckInterval);
        statusCheckInterval = null;
    }
    
    currentClient = null;
    currentBooking = null;
    document.getElementById('authForm').classList.remove('hidden');
    document.getElementById('dashboard').classList.remove('active');
    document.getElementById('authPlate').value = '';
    document.getElementById('authCode').value = '';
    
    showNotification('👋 До свидания!', 'info');
};
