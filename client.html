<script>
// ============================================================
// КОНФИГ
// ============================================================
const SUPABASE_URL = 'https://xpaqczxqkuzfwmnimzsx.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhwYXFjenhxa3V6ZndtbmltenN4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5Njg4NDcsImV4cCI6MjEwNDU0NDg0N30.hH62d6aCsgBchg4MVPey714O3-FR9bNaqnsm_T32zAk';

const APP_VERSION = '5.0';

let currentClient = null;
let currentBooking = null;
let myPriceRequest = null;
let statusCheckInterval = null;
let cachedDiscounts = [];

// ============================================================
// НОРМАЛИЗАЦИЯ ГОС.НОМЕРА (кириллица → латиница)
// ============================================================
function normalizePlate(plate) {
    if (!plate) return '';
    const map = {
        'А':'A', 'В':'B', 'Е':'E', 'К':'K', 'М':'M',
        'Н':'H', 'О':'O', 'Р':'P', 'С':'C', 'Т':'T',
        'У':'Y', 'Х':'X',
        'а':'a', 'в':'b', 'е':'e', 'к':'k', 'м':'m',
        'н':'h', 'о':'o', 'р':'p', 'с':'c', 'т':'t',
        'у':'y', 'х':'x'
    };
    return plate.replace(/[АВЕКМНОРСТУХавекмнорстух]/g, ch => map[ch] || ch)
                .toUpperCase()
                .replace(/\s/g, '');
}

// ============================================================
// РАБОТА С JSON
// ============================================================
async function loadJsonFromServer() {
    try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/app_data?key=eq.palych_data&select=data`, {
            headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
        });
        if (!response.ok) return null;
        const result = await response.json();
        const data = (result && result[0] && result[0].data) ? result[0].data : null;
        // Кэшируем скидки
        if (data && data.discounts) cachedDiscounts = data.discounts;
        return data;
    } catch (e) {
        console.error('loadJsonFromServer:', e);
        return null;
    }
}

async function updateJsonOnServer(updatedData) {
    const jsonData = { ...updatedData, version: APP_VERSION, timestamp: new Date().toISOString() };
    const response = await fetch(`${SUPABASE_URL}/rest/v1/app_data?key=eq.palych_data`, {
        method: 'PATCH',
        headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
            'Content-Type': 'application/json',
            'Prefer': 'return=representation'
        },
        body: JSON.stringify({ data: jsonData, updated_at: new Date().toISOString() })
    });
    if (!response.ok) {
        const insertResponse = await fetch(`${SUPABASE_URL}/rest/v1/app_data`, {
            method: 'POST',
            headers: {
                'apikey': SUPABASE_ANON_KEY,
                'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                'Content-Type': 'application/json',
                'Prefer': 'return=representation'
            },
            body: JSON.stringify({ key: 'palych_data', data: jsonData, updated_at: new Date().toISOString() })
        });
        return await insertResponse.json();
    }
    return await response.json();
}

// ПЕРЕКЛЮЧЕНИЕ ФОРМ

function showRegister() {
    document.getElementById('authForm').classList.add('hidden');
    document.getElementById('registerForm').classList.remove('hidden');

function showLogin() {
    document.getElementById('registerForm').classList.add('hidden');

// ============================================================
// РЕГИСТРАЦИЯ
// ============================================================
async function register() {
    const name = document.getElementById('regName').value.trim();
    const phone = document.getElementById('regPhone').value.trim();
    const car = document.getElementById('regCar').value.trim();
    const rawPlate = document.getElementById('regPlate').value.trim();
    const plate = normalizePlate(rawPlate);
    const carType = document.getElementById('regCarType').value;
    const errorEl = document.getElementById('regError');
    const successEl = document.getElementById('registerSuccess');

    errorEl.style.display = 'none';
    successEl.style.display = 'none';

    if (!name || !phone || !car || !plate) {
        errorEl.textContent = '❌ Заполните все поля';
        errorEl.style.display = 'block';
        return;
    }

    try {
        const jsonData = await loadJsonFromServer();
        if (!jsonData) { errorEl.textContent = '❌ Ошибка загрузки данных'; errorEl.style.display = 'block'; return; }

        if (jsonData.clients && jsonData.clients.find(c => normalizePlate(c.plate) === plate)) {
            errorEl.textContent = '❌ Такой номер уже зарегистрирован';
            errorEl.style.display = 'block';
            return;
        }

        const accessCode = String(Math.floor(1000 + Math.random() * 9000));
        const newId = jsonData.clients ? Math.max(...jsonData.clients.map(c => c.id || 0), 0) + 1 : 1;

        const newClient = {
            id: newId,
            name,
            phone,
            car,
            plate: plate,
            access_code: accessCode,
            carType,
            is_new: true
        };

        if (!jsonData.clients) jsonData.clients = [];
        jsonData.clients.push(newClient);
        await updateJsonOnServer(jsonData);

        successEl.textContent = `✅ Регистрация успешна! Ваш код: ${accessCode}`;
        successEl.style.display = 'block';
        localStorage.setItem('palych_new_client', JSON.stringify({ plate, access_code: accessCode }));
    } catch (e) {
        console.error('register:', e);
        errorEl.textContent = '❌ Ошибка: ' + e.message;
        errorEl.style.display = 'block';
    }
}

// АВТОРИЗАЦИЯ

async function login() {
    const rawPlate = document.getElementById('authPlate').value.trim();
    const rawCode  = document.getElementById('authCode').value.trim();
    const plate = normalizePlate(rawPlate);
    const code  = String(rawCode).trim();
    const errorEl = document.getElementById('authError');
    errorEl.style.display = 'none';

    console.log('🔐 login():', { rawPlate, normalizedPlate: plate, rawCode, code });

    if (!plate || !code) {
        errorEl.textContent = 'Введите номер и код';
        errorEl.style.display = 'block';
        return;
    }

    try {
        const jsonData = await loadJsonFromServer();
        if (!jsonData || !jsonData.clients) {
            errorEl.textContent = '❌ Ошибка загрузки данных';
            errorEl.style.display = 'block';
            return;
        }

        const client = jsonData.clients.find(c => {
            if (!c.plate) return false;
            const dbPlate = normalizePlate(c.plate);
            const dbCode = String(c.access_code || '').trim();
            return dbPlate === plate && dbCode === code;
        });

        if (!client) {
            console.error('❌ Клиент не найден:', { plate, code });
            console.error('❌ Доступные:', jsonData.clients.map(c => ({
                name: c.name, plate: c.plate, norm: normalizePlate(c.plate), code: c.access_code
            })));
            errorEl.textContent = '❌ Неверный номер или код';
            errorEl.style.display = 'block';
            return;
        }

        currentClient = client;
        document.getElementById('authForm').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');

        await loadClientData();
        startAutoRefresh();
        showNotification(`✅ Добро пожаловать, ${client.name}!`, 'success');
    } catch (e) {
        console.error('❌ login error:', e);
        errorEl.textContent = '❌ Ошибка: ' + e.message;
        errorEl.style.display = 'block';
    }
}

// ============================================================
async function loadBooking() {
    try {
        const jsonData = await loadJsonFromServer();
        if (!jsonData || !jsonData.bookings) return;

        const active = jsonData.bookings.find(b =>
            b.client_id === currentClient.id &&
            !['отремонтирована', 'не отремонтирована', 'продиагностирована', 'отменена'].includes(b.status));

        if (active) {
            currentBooking = active;
            updateStatusDisplay(active);
        } else {
            currentBooking = null;
            document.getElementById('statusBadge').textContent = 'Нет активных записей';
            document.getElementById('statusBadge').className = 'badge-status status-new';
            document.getElementById('statusDetail').textContent = 'Вы можете записаться';
            document.getElementById('cancelBtn').classList.add('hidden');
        }
    } catch (e) { console.error(e); }
}

function updateStatusDisplay(b) {
    const map = {
        'новая': { t: 'Новая', c: 'status-new', d: 'Ожидайте подтверждения' },
        'в работе': { t: 'В работе', c: 'status-work', d: 'Мастер занимается авто' },
        'ожидается': { t: 'Ожидается', c: 'status-wait', d: 'Ожидаем запчасти' },
        'готово': { t: '✅ Автомобиль готов', c: 'status-ready', d: 'Можете забрать автомобиль' },
        'отремонтирована': { t: '✅ Отремонтирована', c: 'status-done', d: 'Работы выполнены' },
        'не отремонтирована': { t: '❌ Не отремонтирована', c: 'status-fail', d: 'Обратитесь к мастеру' },
        'продиагностирована': { t: '🔍 Продиагностирована', c: 'status-done', d: 'Диагностика завершена' },
        'отменена': { t: 'Отменена', c: 'status-cancel', d: 'Запись отменена' }
    };
    const info = map[b.status] || { t: b.status, c: 'status-new', d: '' };
    document.getElementById('statusBadge').textContent = info.t;
    document.getElementById('statusBadge').className = 'badge-status ' + info.c;
    document.getElementById('statusDetail').textContent = info.d;

    if (['новая', 'в работе', 'ожидается'].includes(b.status)) {
        document.getElementById('cancelBtn').classList.remove('hidden');
    } else {
        document.getElementById('cancelBtn').classList.add('hidden');
    }
}

async function loadActiveBookings() {
    try {
        const jsonData = await loadJsonFromServer();
        if (!jsonData || !jsonData.bookings) { renderActiveBookings([]); return; }

        const activeBookings = jsonData.bookings.filter(b =>
            b.client_id === currentClient.id &&
            !['отремонтирована', 'не отремонтирована', 'продиагностирована', 'отменена'].includes(b.status));

        activeBookings.sort((a, b) => new Date(b.date) - new Date(a.date));
        renderActiveBookings(activeBookings);
    } catch (e) { console.error(e); }
}

function renderActiveBookings(bookings) {
    const container = document.getElementById('activeBookings');
    const countEl = document.getElementById('activeCount');
    if (countEl) countEl.textContent = bookings.length;

    if (!bookings || bookings.length === 0) {
        container.innerHTML = '<div class="empty-state">Нет активных записей</div>';
        return;
    }

    const typeLabels = { diagnostic: '🔍 Диагностика', repair: '🔧 Ремонт', maintenance: '🛠️ ТО' };
    const statusLabels = {
        'новая': { t: 'Новая', c: 'status-new' },
        'в работе': { t: 'В работе', c: 'status-work' },
        'ожидается': { t: 'Ожидается', c: 'status-wait' },
        'готово': { t: '✅ Готово', c: 'status-ready' }
    };

    container.innerHTML = bookings.map(b => {
        const typeLabel = typeLabels[b.type] || b.type;
        const si = statusLabels[b.status] || { t: b.status, c: 'status-new' };
        const timeDisplay = b.time ? `, ${b.time}` : '';
        return `<div class="active-booking">
            <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px;">
                <div><strong>${typeLabel}</strong> <span style="font-size:0.8rem;color:#3a657e;">📅 ${b.date}${timeDisplay}</span></div>
                <span class="b-status ${si.c}">${si.t}</span>
            </div>
            ${b.reason ? `<div class="b-reason"><i class="fas fa-comment"></i> ${b.reason}</div>` : ''}
        </div>`;
    }).join('');
}

// ============================================================
// ИСТОРИЯ (кликабельная)
// ============================================================
async function loadHistory() {
    const container = document.getElementById('historyContainer');
    try {
        const jsonData = await loadJsonFromServer();
        if (!jsonData || !jsonData.journal) {
            container.innerHTML = '<div class="empty-state">История пуста</div>';
            return;
        }
        const history = jsonData.journal.filter(j => j.clientId === currentClient.id).slice(0, 10);
        if (history.length === 0) {
            container.innerHTML = '<div class="empty-state">История пуста</div>';
            return;
        }
        container.innerHTML = history.map(e => {
            const icon = e.type === 'diagnostic' ? '🔍' : '🔧';
            const name = e.type === 'diagnostic' ? 'Диагностика' : 'Ремонт';

            let totalInfo = '';
            if (e.type === 'repair' && e.parts && e.works) {
                const partsTotal = e.parts.reduce((s, p) => s + ((p.qty || 0) * (p.price || 0)), 0);
                const worksTotal = e.works.reduce((s, w) => s + (w.cost || 0), 0);
                let discountPercent = 0;
                const discVal = e.carData && e.carData.discount;
                if (discVal && discVal !== 'none' && discVal !== '') {
                    const discId = parseInt(discVal);
                    const found = cachedDiscounts.find(d => d.id === discId);
                    if (found) discountPercent = found.percent;
                }
                const grand = partsTotal + worksTotal * (1 - discountPercent / 100);
                totalInfo = `<span style="font-size:0.75rem;color:#1f7b4a;font-weight:700;margin-left:8px;">${Math.round(grand)} ₽</span>`;
            }

            return `<div class="history-card jv-history-card" onclick="viewJournalEntry(${e.id})">
                <div><strong>${icon} ${name}</strong> <span style="font-size:0.8rem;color:#3a657e;">${e.car||''}</span>${totalInfo}</div>
                <div>
                    <span style="font-size:0.8rem;color:#3a657e;">${e.date||''}</span>
                    <span class="h-status" style="margin-left:8px;">👁 Открыть</span>
                </div>
            </div>`;
        }).join('');
    } catch (e) {
        console.error(e);
        container.innerHTML = '<div style="color:#b33c3c;text-align:center;padding:20px;">Ошибка</div>';
    }
}

async function viewJournalEntry(entryId) {
    try {
        const jsonData = await loadJsonFromServer();
        if (!jsonData || !jsonData.journal) return;
        const entry = jsonData.journal.find(e => e.id === entryId);
        if (!entry) { showNotification('❌ Запись не найдена', 'error'); return; }

        // Проверка прав: clientId может отсутствовать в старых записях
        if (entry.clientId && entry.clientId !== currentClient.id) {
            showNotification('⛔ Нет доступа к этой записи', 'error');
            return;
        }

        if (entry.type === 'diagnostic') {
            renderDiagView(entry);
        } else if (entry.type === 'repair') {
            renderRepairView(entry);
        }
        document.getElementById('journalViewModal').classList.add('active');
    } catch (e) {
        console.error(e);
        showNotification('❌ Ошибка загрузки', 'error');
    }
}

// --- Просмотр диагностики ---
function renderDiagView(entry) {
    document.getElementById('journalViewTitle').textContent = '🔍 Лист диагностики';
    const c = entry.carData || {};
    let html = `
        <div class="jv-car-info">
            <div><b>Марка:</b> ${escapeHtml(c.make || '—')}</div>
            <div><b>Гос. номер:</b> <span class="jv-plate-badge">${escapeHtml(c.plate || '—')}</span></div>
            <div><b>Год:</b> ${escapeHtml(c.year || '—')}</div>
            <div><b>Пробег:</b> ${escapeHtml(c.mileage || '—')} км</div>
            <div><b>Дата:</b> ${escapeHtml(c.date || entry.date || '—')}</div>
            <div style="grid-column:1/-1;"><b>Жалобы:</b> ${escapeHtml(c.complaints || '—')}</div>
        </div>
    `;
    const sysIds = entry.systems || [];
    const tables = entry.tables || {};
    let hasContent = false;
    sysIds.forEach(sysId => {
        const sysName = getSystemName(sysId);
        const rows = (tables[sysId] || []).filter(r => r.checked && r.value && r.value.trim() !== '');
        if (rows.length === 0) return;
        hasContent = true;
        html += `<div class="jv-section">
            <div class="jv-section-title">🔧 ${escapeHtml(sysName)}</div>
            <div class="jv-row header" style="grid-template-columns: 2fr 1fr 1fr 1.5fr;">
                <span>Параметр</span><span>Значение</span><span>Статус</span><span>Примечание</span>
            </div>`;
        rows.forEach(r => {
            let statusHtml = '';
            if (r.status === 'ok') statusHtml = `<span class="jv-status-badge jv-status-ok">✅ норма</span>`;
            else if (r.status === 'fail') statusHtml = `<span class="jv-status-badge jv-status-fail">⚠️ поломка</span>`;
            else statusHtml = `<span class="jv-status-badge jv-status-unknown">❓ не опр.</span>`;
            html += `<div class="jv-row" style="grid-template-columns: 2fr 1fr 1fr 1.5fr;">
                <span style="font-weight:600;color:#0b2b3c;">${escapeHtml(r.param)}</span>
                <span>${escapeHtml(r.value || '')}</span>
                <span>${statusHtml}</span>
                <span style="color:#3a657e;font-style:italic;font-size:0.75rem;">${escapeHtml(r.note || '')}</span>
            </div>`;
        });
        html += `</div>`;
    });
    if (!hasContent) {
        html += `<div class="jv-empty-msg">📭 Нет отмеченных параметров в этой диагностике</div>`;
    }
    document.getElementById('journalViewContent').innerHTML = html;
}

// --- Просмотр ремонта (акт) ---
function renderRepairView(entry) {
    document.getElementById('journalViewTitle').textContent = '🔧 Акт выполненных работ';
    const c = entry.carData || {};
    const parts = entry.parts || [];
    const works = entry.works || [];

    // Считаем скидку
    let discountPercent = 0;
    let discountName = '';
    const discVal = c.discount;
    if (discVal && discVal !== 'none' && discVal !== '') {
        const discId = parseInt(discVal);
        const found = cachedDiscounts.find(d => d.id === discId);
        if (found) { discountPercent = found.percent; discountName = found.name; }
    }

    let html = `
        <div class="jv-car-info">
            <div><b>Марка:</b> ${escapeHtml(c.make || '—')}</div>
            <div><b>Гос. номер:</b> <span class="jv-plate-badge">${escapeHtml(c.plate || '—')}</span></div>
            <div><b>Год:</b> ${escapeHtml(c.year || '—')}</div>
            <div><b>Пробег:</b> ${escapeHtml(c.mileage || '—')} км</div>
            <div><b>Дата ремонта:</b> ${escapeHtml(c.date || entry.date || '—')}</div>
            <div style="grid-column:1/-1;"><b>Жалобы:</b> ${escapeHtml(c.complaints || '—')}</div>
            ${discountPercent > 0 ? `<div style="grid-column:1/-1;"><b>Скидка:</b> <span style="background:#f6b83d;color:#0b2b3c;padding:2px 10px;border-radius:10px;font-weight:600;font-size:0.8rem;">${escapeHtml(discountName)} (${discountPercent}%)</span></div>` : ''}
        </div>
    `;

    const partsTotal = parts.reduce((s, p) => s + ((p.qty || 0) * (p.price || 0)), 0);
    const worksTotal = works.reduce((s, w) => s + (w.cost || 0), 0);
    const discountAmount = worksTotal * (discountPercent / 100);
    const worksTotalWithDiscount = worksTotal - discountAmount;
    const grandTotal = partsTotal + worksTotalWithDiscount;

    // Запчасти
    html += `<div class="jv-section">
        <div class="jv-section-title">📦 Запчасти</div>`;
    if (parts.length === 0) {
        html += `<div style="padding:10px 14px;color:#4a6f82;font-size:0.85rem;">Нет запчастей</div>`;
    } else {
        html += `<div class="jv-row header grid-3"><span>Наименование</span><span>Кол-во</span><span>Сумма</span></div>`;
        parts.forEach(p => {
            html += `<div class="jv-row grid-3">
                <span>${escapeHtml(p.name)}</span>
                <span>${p.qty} шт.</span>
                <span>${((p.qty || 0) * (p.price || 0)).toFixed(0)} ₽</span>
            </div>`;
        });
        html += `<div class="jv-total">Итого запчасти: ${partsTotal.toFixed(0)} ₽</div>`;
    }
    html += `</div>`;

    // Работы
    html += `<div class="jv-section">
        <div class="jv-section-title">🔧 Работы</div>`;
    if (works.length === 0) {
        html += `<div style="padding:10px 14px;color:#4a6f82;font-size:0.85rem;">Нет работ</div>`;
    } else {
        html += `<div class="jv-row header grid-4"><span>Наименование</span><span>Примечание</span><span>Стоимость</span><span></span></div>`;
        works.forEach(w => {
            const cost = w.cost || 0;
            const costDisc = discountPercent > 0 ? cost * (1 - discountPercent / 100) : cost;
            let priceHtml = '';
            if (discountPercent > 0) {
                priceHtml = `<span class="old-price">${cost.toFixed(0)} ₽</span><span class="new-price">${costDisc.toFixed(0)} ₽</span>`;
            } else {
                priceHtml = `${cost.toFixed(0)} ₽`;
            }
            html += `<div class="jv-row grid-4">
                <span>${escapeHtml(w.name)}</span>
                <span style="color:#3a657e;font-size:0.75rem;font-style:italic;">${escapeHtml(w.note || '')}</span>
                <span>${priceHtml}</span>
                <span></span>
            </div>`;
        });
        html += `<div class="jv-total">
            ${discountPercent > 0
                ? `Итого работы со скидкой ${discountPercent}%: <span class="new-price">${worksTotalWithDiscount.toFixed(0)} ₽</span>`
                : `Итого работы: ${worksTotal.toFixed(0)} ₽`}
        </div>`;
    }
    html += `</div>`;

    // Общая сумма
    html += `<div style="margin-top:16px; padding:14px; background:#f8fafc; border-radius:8px; border:2px solid #0b2b3c; text-align:center;">
        <div style="font-size:1.2rem; font-weight:700; color:#0b2b3c;">ОБЩАЯ СТОИМОСТЬ: ${grandTotal.toFixed(0)} ₽</div>
        ${discountPercent > 0 ? `<div style="font-size:0.85rem; color:#0a6030; margin-top:4px;">✅ Вы сэкономили ${discountAmount.toFixed(0)} ₽</div>` : ''}
    </div>`;

    document.getElementById('journalViewContent').innerHTML = html;
}

// --- Вспомогательные ---
function escapeHtml(str) {
    return String(str || '').replace(/[&<>"']/g, s => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[s]);
}

function getSystemName(sysId) {
    const names = {
        engine: 'Двигатель',
        cooling: 'Система охлаждения',
        brakes: 'Тормозная система',
        ignition: 'Система зажигания',
        lights: 'Световые приборы',
        ac: 'Кондиционирование',
        exhaust: 'Выхлопная система',
        interior_electronics: 'Салонная электроника',
        suspension: 'Подвеска'
    };
    return names[sysId] || sysId;
}

function openPriceRequestModal() {
    document.getElementById('priceRequestModal').classList.add('active');
    document.getElementById('priceRequestText').value = '';
}

function closePriceRequestModal() {
    document.getElementById('priceRequestModal').classList.remove('active');
}

async function submitPriceRequest() {
    const text = document.getElementById('priceRequestText').value.trim();
    if (!text) { showNotification('⚠️ Введите описание', 'error'); return; }

    try {
        const jsonData = await loadJsonFromServer();
        if (!jsonData) { showNotification('❌ Ошибка', 'error'); return; }

        if (!jsonData.priceRequests) jsonData.priceRequests = [];
        if (!jsonData.priceRequestIdCounter) jsonData.priceRequestIdCounter = 1;

        jsonData.priceRequests.forEach(r => {
            if (r.client_id === currentClient.id && r.status === 'active') {
                r.status = 'archived';
            }
        });

        const newId = jsonData.priceRequestIdCounter++;
        jsonData.priceRequests.push({
            id: newId,
            client_id: currentClient.id,
            request_text: text,
            reply_text: '',
            status: 'active',
            timestamp: new Date().toISOString()
        });

        await updateJsonOnServer(jsonData);
        closePriceRequestModal();
        await loadMyPriceRequest();
        showNotification('✅ Запрос отправлен!', 'success');
    } catch (e) {
        showNotification('❌ Ошибка: ' + e.message, 'error');
    }
}

async function loadMyPriceRequest() {
    const container = document.getElementById('myPriceRequest');
    if (!container) return;

    try {
        const jsonData = await loadJsonFromServer();
        if (!jsonData || !jsonData.priceRequests) {
            container.innerHTML = '<div class="empty-state" style="padding:12px;">Нет запросов</div>';
            return;
        }

        const now = Date.now();
        const tenDays = 10 * 24 * 60 * 60 * 1000;

        const myRequests = jsonData.priceRequests
            .filter(r => r.client_id === currentClient.id)
            .filter(r => {
                const age = now - new Date(r.timestamp).getTime();
                return r.status === 'active' || r.status === 'replied' || age < tenDays;
            })
            .sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));

        if (myRequests.length === 0) {
            container.innerHTML = '<div class="empty-state" style="padding:12px;">Нет активных запросов</div>';
            return;
        }

        const req = myRequests[0];
        const statusClass = req.status === 'replied' ? 'replied' : 'active';
        const statusText = req.status === 'replied' ? '✅ Ответ получен' : '⏳ Ожидает ответа';
        const date = new Date(req.timestamp).toLocaleString();

        container.innerHTML = `
            <div class="price-request-card">
                <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;">
                    <strong>Ваш запрос</strong>
                    <span class="req-status ${statusClass}">${statusText}</span>
                </div>
                <div class="req-text">
                    <strong>Что нужно:</strong><br>${req.request_text}
                    <div style="font-size:0.7rem;color:#3a657e;margin-top:4px;">📅 ${date}</div>
                </div>
                ${req.reply_text ? `
                    <div class="req-reply">
                        <strong>💬 Ответ сервиса:</strong><br>${req.reply_text}
                    </div>
                ` : ''}
            </div>
        `;
    } catch (e) {
        container.innerHTML = '<div style="color:#b33c3c;text-align:center;padding:12px;">Ошибка загрузки</div>';
    }
}

// ============================================================
// ЗАПИСЬ НА ОБСЛУЖИВАНИЕ
// ============================================================
function toggleBookingForm() {
    const form = document.getElementById('bookingForm');
    form.classList.toggle('hidden');
    if (!form.classList.contains('hidden')) {
        document.getElementById('bkDate').value = new Date().toISOString().slice(0,10);
        document.getElementById('bkTime').value = '';
        document.getElementById('bkReason').value = '';
    }
}

async function createBooking() {
    if (!currentClient) return;

    const type = document.getElementById('bkType').value;
    const date = document.getElementById('bkDate').value;
    const time = document.getElementById('bkTime').value;
    const reason = document.getElementById('bkReason').value.trim();

    if (!date) { showNotification('⚠️ Выберите дату', 'error'); return; }

    try {
        const jsonData = await loadJsonFromServer();
        if (!jsonData) { showNotification('❌ Ошибка', 'error'); return; }

        if (!jsonData.bookings) jsonData.bookings = [];

        const newId = jsonData.bookings.length > 0
            ? Math.max(...jsonData.bookings.map(b => b.id || 0)) + 1 : 1;

        jsonData.bookings.push({
            id: newId,
            client_id: currentClient.id,
            name: currentClient.name,
            phone: currentClient.phone,
            plate: currentClient.plate,
            car: currentClient.car,
            type, date, time: time || null, reason: reason || null,
            status: 'новая', is_new: true,
            created_at: new Date().toISOString()
        });

        await updateJsonOnServer(jsonData);
        showNotification('✅ Заявка отправлена!', 'success');
        document.getElementById('bookingForm').classList.add('hidden');
        await loadBooking();
        await loadActiveBookings();
        await loadHistory();
    } catch (e) {
        showNotification('❌ Ошибка: ' + e.message, 'error');
    }
}

// ============================================================
// ОТМЕНА
// ============================================================
async function cancelBooking() {
    if (!currentBooking) return;
    if (!confirm('Отменить запись?')) return;

    try {
        const jsonData = await loadJsonFromServer();
        if (!jsonData || !jsonData.bookings) return;
        const booking = jsonData.bookings.find(b => b.id === currentBooking.id);
        if (booking) booking.status = 'отменена';
        await updateJsonOnServer(jsonData);
        showNotification('✅ Запись отменена', 'success');
        currentBooking = null;
        await loadClientData();
    } catch (e) {
        showNotification('❌ Ошибка', 'error');
    }
}

// ============================================================
// ОБНОВЛЕНИЕ
// ============================================================
async function refreshStatus() {
    if (!currentClient) return;
    await loadBooking();
    await loadActiveBookings();
    await loadHistory();
    await loadMyPriceRequest();
    showNotification('✅ Данные обновлены', 'success');
}

function startAutoRefresh() {
    if (statusCheckInterval) clearInterval(statusCheckInterval);
    statusCheckInterval = setInterval(async () => {
        if (!currentClient) return;
        await loadBooking();
        await loadActiveBookings();
        await loadMyPriceRequest();
    }, 15000);
}

// ============================================================
// ВЫХОД
// ============================================================
function logout() {
    if (!confirm('Выйти?')) return;
    if (statusCheckInterval) clearInterval(statusCheckInterval);
    currentClient = null;
    currentBooking = null;
    myPriceRequest = null;
    document.getElementById('authForm').classList.remove('hidden');
    document.getElementById('registerForm').classList.add('hidden');
    document.getElementById('dashboard').classList.add('hidden');
    document.getElementById('authPlate').value = '';
    document.getElementById('authCode').value = '';
}

// ============================================================
// УВЕДОМЛЕНИЯ
// ============================================================
function showNotification(message, type = 'info') {
    const existing = document.querySelector('.notification');
    if (existing) existing.remove();
    const div = document.createElement('div');
    div.className = `notification ${type}`;
    div.textContent = message;
    document.body.appendChild(div);
    setTimeout(() => {
        div.style.opacity = '0';
        div.style.transition = 'opacity 0.5s';
        setTimeout(() => div.remove(), 500);
    }, 3500);
}

// ============================================================
// ИНИЦИАЛИЗАЦИЯ — с автовходом из QR
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('bkDate').value = new Date().toISOString().slice(0,10);

    // === Автовход из QR-кода ===
    const urlParams = new URLSearchParams(window.location.search);
    const qrPlate = urlParams.get('plate');
    const qrCode  = urlParams.get('code');

    console.log('🔍 URL:', window.location.href);
    console.log('🔍 Параметры:', { qrPlate, qrCode });

    if (qrPlate && qrCode) {
        const cleanPlate = qrPlate.trim().toUpperCase();
        const cleanCode  = String(qrCode).trim();

        console.log('📝 После очистки:', { cleanPlate, cleanCode });
        console.log('📝 Нормализованный plate:', normalizePlate(cleanPlate));

        document.getElementById('authPlate').value = cleanPlate;
        document.getElementById('authCode').value  = cleanCode;
        document.getElementById('qrBanner').classList.remove('hidden');
        window.history.replaceState({}, document.title, window.location.pathname);

        setTimeout(() => {
            console.log('🚀 Автовход...');
            login();
        }, 400);
    }

    // === Автозаполнение после регистрации ===
    const saved = localStorage.getItem('palych_new_client');
    if (saved) {
        try {
            const data = JSON.parse(saved);
            document.getElementById('authPlate').value = data.plate || '';
            document.getElementById('authCode').value  = data.access_code || '';
            localStorage.removeItem('palych_new_client');
        } catch(e) {}
    }

    // === Закрытие модалки по клику на фон ===
    const jvModal = document.getElementById('journalViewModal');
    if (jvModal) {
        jvModal.addEventListener('click', function(e) {
            if (e.target === this) closeJournalView();
        });
    }
    const prModal = document.getElementById('priceRequestModal');
    if (prModal) {
        prModal.addEventListener('click', function(e) {
            if (e.target === this) closePriceRequestModal();
        });
    }
});

        deferredPrompt = e;
    });

    window.installApp = async function() {
        if (!deferredPrompt) {
            alert('Установка недоступна. Используйте меню браузера: "Добавить на главный экран"');
            return;
        }
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        console.log('Установка:', outcome);
        deferredPrompt = null;
    };
